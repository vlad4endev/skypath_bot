<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Открываем приложение…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e1f;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      line-height: 1.5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(138, 156, 254, 0.2);
      border-top-color: #8a9cfe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: rgba(190, 200, 230, 0.75); font-size: 15px; max-width: 320px; }
    a {
      color: #8a9cfe;
      text-decoration: none;
      font-weight: 600;
    }
    #fallback { margin-top: 20px; display: none; }
  </style>
</head>
<body>
  <div class="spinner" id="loader"></div>
  <p id="status">Открываем VPN-приложение…</p>
  <p id="fallback">
    Если ничего не произошло, <a id="manual" href="#">нажмите здесь</a>.
  </p>
  <script>
    (function () {
      var ALLOWED = ['happ://', 'v2raytun://'];

      function fail(message) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('status').textContent = message;
      }

      var raw = new URLSearchParams(location.search).get('url');
      if (!raw) {
        fail('Ссылка не указана.');
        return;
      }

      var target;
      try {
        target = decodeURIComponent(raw);
      } catch (e) {
        fail('Неверная ссылка.');
        return;
      }

      if (!ALLOWED.some(function (prefix) { return target.indexOf(prefix) === 0; })) {
        fail('Недопустимый тип ссылки.');
        return;
      }

      document.getElementById('manual').href = target;

      setTimeout(function () {
        document.getElementById('fallback').style.display = 'block';
      }, 1200);

      window.location.href = target;
    })();
  </script>
</body>
</html>
