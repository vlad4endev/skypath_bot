services:
  postgres:
    image: postgres:16-alpine
    container_name: vpn_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpnbot
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d vpnbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vpnbot:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/vpnbot
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vpnbot:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/vpnbot
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy

volumes:
  postgres_data:
