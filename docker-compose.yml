services:
  postgres:
    image: postgres:16-alpine
    container_name: skypath_db
    restart: always
    environment:
      POSTGRES_DB: skypath
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт на хост не пробрасываем — бот ходит на postgres:5432 внутри сети Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d skypath"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skypath_net

  redis:
    image: redis:7-alpine
    container_name: skypath_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - skypath_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skypath_bot
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOT_HOST_PORT:-8084}:8080"
    volumes:
      - ./webapp:/app/webapp:ro
    networks:
      - skypath_net

  nginx:
    image: nginx:alpine
    container_name: skypath_nginx
    restart: always
    depends_on:
      - bot
    env_file: .env
    environment:
      NGINX_DOMAIN: ${NGINX_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./webapp:/var/www/webapp:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      /bin/sh -c "envsubst '$$NGINX_DOMAIN'
      < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    networks:
      - skypath_net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    networks:
      - skypath_net

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  certbot_www:

networks:
  skypath_net:
    name: skypath_bot_skypath_net
    external: true
